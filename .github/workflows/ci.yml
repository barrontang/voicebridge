name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift Build
        run: swift build -c release
      - name: Swift Test
        run: swift test
       - name: No printf/`print(` in Core (Finding 5)
        # Diagnostic output must go through os.Logger (VBLog); nothing in Core
        # may write to stdout except the CLI's explicit user-facing path.
        run: |
          if grep -rn 'print(' Sources/VoiceBridgeCore --include='*.swift' \
              | grep -v '/VBLog.swift' | grep -v '///'; then
            echo "::error::Core writes to stdout; route diagnostics through VBLog."; exit 1
          fi
