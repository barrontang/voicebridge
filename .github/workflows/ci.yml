name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Swift Build (release)
        run: swift build -c release

      - name: Swift Test
        run: swift test
        env:
          # Never touch a real settings file from a test run.
          VOICEBRIDGE_CONFIG_PATH: ${{ runner.temp }}/voicebridge-test-config.json

      - name: No print( in Core (Finding 5)
        # Diagnostic output must go through os.Logger (VBLog); nothing in Core
        # may write to stdout except the CLI's explicit user-facing path.
        run: |
          if grep -rnE '\bprint[[:space:]]*\(' Sources/VoiceBridgeCore --include='*.swift' \
              | grep -v '/VBLog.swift' | grep -vE '^\S+:[0-9]+:[[:space:]]*///'; then
            echo "::error::Core writes to stdout; route diagnostics through VBLog."; exit 1
          fi

      - name: Tests never touch the real settings file
        # A config manager built without an explicit settings file would
        # persist into the user's ~/Library/Application Support - a test must
        # never do that.
        run: |
          if grep -rn 'TTSConfigManager()' Tests --include='*.swift'; then
            echo "::error::A test builds a config manager without an explicit settings file."
            exit 1
          fi

      - name: No force-unwraps in Core
        # A force-unwrap in the core turns a recoverable engine error into a
        # crash; the CLI/UI may use them at the top level.
        run: |
          if grep -rnE '[A-Za-z0-9_)]!([.,;)]|$)' Sources/VoiceBridgeCore --include='*.swift' \
              | grep -vE '^\S+:[0-9]+:[[:space:]]*///'; then
            echo "::error::Force-unwrap found in Core."; exit 1
          fi

  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate workflow YAML
        run: ruby -ryaml -e 'YAML.load_file(".github/workflows/ci.yml"); puts "yaml ok"'

      # actionlint ships a container action, which only runs on Linux - so
      # the binary is fetched directly (pinned version) instead.
      - name: actionlint
        run: |
          VERSION=1.7.12
          case "$(uname -m)" in
            arm64) ARCH=darwin_arm64 ;;
            *)     ARCH=darwin_x86_64 ;;
          esac
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_${ARCH}.tar.gz" \
            | tar xz actionlint
          ./actionlint

      - name: The version is in sync
        run: |
          CLI_VERSION=$(grep -oE 'static let version = "[^"]+"' Sources/voicebridge-cli/VoiceBridgeCLI.swift | grep -oE '[0-9][^"]+')
          FILE_VERSION=$(cat VERSION)
          if [ "$CLI_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::The CLI version ($CLI_VERSION) and VERSION ($FILE_VERSION) differ."
            exit 1
          fi
